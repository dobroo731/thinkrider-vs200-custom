name: Build Windows Tray EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release tray.exe
        run: cargo build --release --bin tray

      - name: Upload tray.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinkrider-vs200-tray-windows
          path: target/release/tray.exe

      - name: Attach tray.exe to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tray.exe
