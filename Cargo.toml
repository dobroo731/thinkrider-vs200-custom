[package]
name = "thinkrider-vs200-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
btleplug = "0.12.0"
uuid = { version = "1", features = ["v4"] }
enigo = "0.6.1"
futures = "0.3.32"
tokio = { version = "1.53.0", features = ["full"] }
tray-icon = "0.24"
winit = "0.30"
notify-rust = "4.18"
strum = { version = "0.28.0", features = ["derive"] }
async-trait = "0.1.89"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
