<svg width="512" height="512" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background is transparent -->

  <!-- BICYCLE OUTLINE (Going Left) -->
  <g stroke="#1A1A1A" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front Wheel -->
    <circle cx="6" cy="18" r="4" />

    <!-- Handlebars and Fork -->
    <path d="M6 13V12L8 11" stroke-width="0.8" />
    <path d="M8 11H10" stroke-width="0.8" />

    <!-- Frame / Main Body -->
    <path d="M6 18L10 12L16 12" />
    <path d="M10 12L13 18" />

    <!-- Seat (Remains visible) -->
    <path d="M15 11H17" stroke-width="0.8" />

    <!-- Back Wheel (Arcs to leave a gap for the bolt) -->
    <!-- Top arc -->
    <path d="M14 18C14 15.5 16 14 18 14" />
    <!-- Bottom arc -->
    <path d="M18 22C16 22 14 20.5 14 18" />
    <!-- Right arc -->
    <path d="M18 14C20.5 14 22 16 22 18C22 20 20.5 22 18 22" />
  </g>

  <!-- THUNDERBOLT (Bold filled shape for visibility) -->
  <!-- Points: Top -> MidLeftOuter -> BottomTip -> MidRightInner -> MidLeftInner -> TopRight -> Close -->
  <!-- <path d="M21 10 L15 17 H19 L16 23 L22 16 H18 Z" fill="orange" /> -->
  <path d="M20 10 L14 17 H18 L15 23 L21 16 H17 Z" fill="orange" />
</svg>
